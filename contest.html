<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Contest | VBC Votes</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef3ff;
    margin:0;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#003399;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:13px;
    background:#18a84b;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

a{
    display:block;
    margin-top:20px;
    text-align:center;
    color:#003399;
    font-weight:bold;
    text-decoration:none;
}

#loading{
    text-align:center;
    padding:40px;
    font-size:18px;
}

</style>

</head>


<body>


<div id="loading">

    Checking admin access...

</div>


<div
    class="container"
    id="contestPage"
    style="display:none;"
>

<h1>
Create New Contest
</h1>


<form id="contestForm">


<input
    type="text"
    id="organizationName"
    placeholder="Organization Name"
    required
>


<input
    type="text"
    id="contestName"
    placeholder="Contest Name"
    required
>


<input
    type="text"
    id="organizer"
    placeholder="Organizer Name"
    required
>


<input
    type="date"
    id="startDate"
    required
>


<input
    type="date"
    id="endDate"
    required
>


<textarea
    id="description"
    placeholder="Contest Description"
    rows="5"
    required
></textarea>


<button
    type="submit"
    id="createButton"
>

    Create Contest

</button>


</form>


<a href="dashboard.html">

← Back to Dashboard

</a>


</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://dwedhbcsgfdqvurgnuvf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UP8hJISXy2-O_bpmmz3mow_ZqajzBeM";


/* =========================
   CHECK ADMIN LOGIN
========================= */

async function checkAdmin(){

    const token =
        localStorage.getItem(
            "vbc_access_token"
        );


    if(!token){

        window.location.href =
            "login.html";

        return;

    }


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/auth/v1/user",

                {

                    method:"GET",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            token

                    }

                }

            );


        if(!response.ok){

            localStorage.removeItem(
                "vbc_access_token"
            );

            localStorage.removeItem(
                "vbc_refresh_token"
            );

            localStorage.removeItem(
                "vbc_user_email"
            );

            window.location.href =
                "login.html";

            return;

        }


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "contestPage"
        ).style.display =
            "block";


    }catch(error){

        console.error(error);

        window.location.href =
            "login.html";

    }

}


/* =========================
   CREATE CONTEST
========================= */

const form =
    document.getElementById(
        "contestForm"
    );


form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const organizationName =
            document.getElementById(
                "organizationName"
            ).value.trim();


        const contestName =
            document.getElementById(
                "contestName"
            ).value.trim();


        const organizer =
            document.getElementById(
                "organizer"
            ).value.trim();


        const startDate =
            document.getElementById(
                "startDate"
            ).value;


        const endDate =
            document.getElementById(
                "endDate"
            ).value;


        const description =
            document.getElementById(
                "description"
            ).value.trim();


        if(
            !organizationName ||
            !contestName ||
            !organizer ||
            !startDate ||
            !endDate ||
            !description
        ){

            alert(
                "Please fill in all fields."
            );

            return;

        }


        const contest = {

            organization_name:
                organizationName,

            name:
                contestName,

            organizer:
                organizer,

            start_date:
                startDate,

            end_date:
                endDate,

            description:
                description

        };


        const createButton =
            document.getElementById(
                "createButton"
            );


        createButton.disabled =
            true;


        createButton.textContent =
            "Creating Contest...";


        try{

            const response =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/contests",

                    {

                        method:"POST",

                        headers:{

                            "Content-Type":
                                "application/json",

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "Prefer":
                                "return=representation"

                        },

                        body:
                            JSON.stringify(
                                contest
                            )

                    }

                );


            const responseText =
                await response.text();


            console.log(
                "Supabase response:",
                responseText
            );


            if(!response.ok){

                alert(
                    "Contest could not be created:\n\n" +
                    responseText
                );

                return;

            }


            alert(
                "Contest Created Successfully!"
            );


            form.reset();


        }catch(error){

            console.error(error);

            alert(
                "Connection error:\n\n" +
                error.message
            );

        }finally{

            createButton.disabled =
                false;

            createButton.textContent =
                "Create Contest";

        }

    }
);


/* =========================
   START
========================= */

checkAdmin();

</script>

</body>

</html>
