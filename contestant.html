<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register Contestant | VBC Votes</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef3ff;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,.2);
}

h1 {
    text-align: center;
    color: #003399;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    background: #0066ff;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #004bcc;
}

a {
    display: block;
    margin-top: 20px;
    text-align: center;
    text-decoration: none;
    color: #003399;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Register Contestant</h1>
<form id="contestantForm">

<input
    type="text"
    id="name"
    placeholder="Contestant Name"
    required
>

<input
    type="text"
    id="phone"
    placeholder="Phone Number"
    required
>

<input
    type="email"
    id="email"
    placeholder="Email Address"
    required
>

<select id="contest" required>
    <option value="">Select Contest</option>
</select>

<input
    type="file"
    id="photo"
    accept="image/*"
    required
>

<button type="submit">
Register Contestant
</button>

</form>
<a href="dashboard.html">
← Back to Dashboard
</a>

</div>

<script>

const SUPABASE_URL =
    "https://dwedhbcsgfdqvurgnuvf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UP8hJISXy2-O_bpmmz3mow_ZqajzBeM";

const BUCKET =
    "contestant-photos";


const contestSelect =
    document.getElementById("contest");

const form =
    document.getElementById("contestantForm");


/* =========================
   LOAD CONTESTS
========================= */

async function loadContests() {

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/contests?select=id,name&order=created_at.desc",
            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }
            }
        );


        if (!response.ok) {

            const error =
                await response.text();

            alert(
                "Could not load contests: " +
                error
            );

            return;
        }


        const contests =
            await response.json();


        contestSelect.innerHTML =
            '<option value="">Select Contest</option>';


        contests.forEach(function(contest) {

            const option =
                document.createElement("option");

            option.value = contest.name;

            option.textContent = contest.name;

            contestSelect.appendChild(option);

        });


    } catch (error) {

        console.error(error);

        alert(
            "Connection error while loading contests."
        );

    }

}


/* =========================
   REGISTER CONTESTANT
========================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document.getElementById("name")
            .value.trim();

        const phone =
            document.getElementById("phone")
            .value.trim();

        const email =
            document.getElementById("email")
            .value.trim();

        const contest =
            document.getElementById("contest")
            .value.trim();

        const photoInput =
            document.getElementById("photo");

        const photo =
            photoInput.files[0];


        if (
            !name ||
            !phone ||
            !email ||
            !contest ||
            !photo
        ) {

            alert(
                "Please fill in all the required fields."
            );

            return;
        }


        try {

            /* =========================
               CREATE UNIQUE PHOTO NAME
            ========================= */

            const fileExtension =
                photo.name
                .split(".")
                .pop()
                .toLowerCase();


            const fileName =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2, 10) +
                "." +
                fileExtension;


            /* =========================
               UPLOAD PHOTO
            ========================= */

            const uploadResponse =
                await fetch(
                    SUPABASE_URL +
                    "/storage/v1/object/" +
                    BUCKET +
                    "/" +
                    fileName,
                    {

                        method: "POST",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "Content-Type":
                                photo.type,

                            "x-upsert":
                                "false"

                        },

                        body: photo

                    }
                );


            if (!uploadResponse.ok) {

                const error =
                    await uploadResponse.text();

                alert(
                    "Photo upload failed: " +
                    error
                );

                return;
            }


            /* =========================
               GET PUBLIC PHOTO URL
            ========================= */

            const photoUrl =
                SUPABASE_URL +
                "/storage/v1/object/public/" +
                BUCKET +
                "/" +
                fileName;


            /* =========================
               SAVE CONTESTANT
            ========================= */

            const contestant = {

                name: name,

                phone: phone,

                email: email,

                contest: contest,

                photo: photoUrl,

                votes: 0

            };


            const saveResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/contestants",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "Prefer":
                                "return=minimal"

                        },

                        body:
                            JSON.stringify(
                                contestant
                            )

                    }
                );


            if (!saveResponse.ok) {

                const error =
                    await saveResponse.text();

                alert(
                    "Contestant could not be saved: " +
                    error
                );

                return;
            }


            alert(
                "Contestant Registered Successfully!"
            );


            form.reset();


        } catch (error) {

            console.error(error);

            alert(
                "Connection error. Please try again."
            );

        }

    }
);


/* LOAD CONTESTS WHEN PAGE OPENS */

loadContests();

</script>

</body>
</html>
