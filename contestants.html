<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VBC Votes - Contestants</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef3ff;
    margin:0;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
}

h1{
    text-align:center;
    color:#003399;
}

#contestSelect{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

.contestant{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

.contestant img{
    display:block;
    width:150px;
    height:150px;
    object-fit:cover;
    margin:0 auto 15px;
    border-radius:8px;
}

.contestant h3{
    color:#003399;
    text-align:center;
}

.contestant p{
    line-height:1.5;
}

.back{
    display:block;
    width:100%;
    padding:12px;
    background:#0066ff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    text-align:center;
    text-decoration:none;
    box-sizing:border-box;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>Registered Contestants</h1>

<select id="contestSelect">

    <option value="">
        Select Contest
    </option>

</select>

<div id="contestantList">

    <p>Please select a contest.</p>

</div>

<a class="back" href="dashboard.html">
    ← Back to Dashboard
</a>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://dwedhbcsgfdqvurgnuvf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UP8hJISXy2-O_bpmmz3mow_ZqajzBeM";


/* =========================
   ELEMENTS
========================= */

const contestSelect =
    document.getElementById(
        "contestSelect"
    );

const contestantList =
    document.getElementById(
        "contestantList"
    );


/* =========================
   LOAD CONTESTS
========================= */

async function loadContests(){

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/contests?select=id,name&order=id.asc",
                {
                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        if(!response.ok){

            const error =
                await response.text();

            contestantList.innerHTML =
                "<p>Could not load contests.</p>";

            console.error(error);

            return;

        }


        const contests =
            await response.json();


        contests.forEach(
            function(contest){

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    contest.name;

                option.textContent =
                    contest.name;

                contestSelect.appendChild(
                    option
                );

            }
        );


    }catch(error){

        console.error(error);

        contestantList.innerHTML =
            "<p>Connection error.</p>";

    }

}


/* =========================
   LOAD CONTESTANTS
========================= */

async function loadContestants(){

    contestantList.innerHTML =
        "<p>Loading contestants...</p>";


    const selectedContest =
        contestSelect.value;


    if(!selectedContest){

        contestantList.innerHTML =
            "<p>Please select a contest.</p>";

        return;

    }


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/contestants?select=id,name,phone,email,contest,photo,votes&contest=eq." +
                encodeURIComponent(selectedContest) +
                "&order=id.asc",
                {
                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        if(!response.ok){

            const error =
                await response.text();

            console.error(error);

            contestantList.innerHTML =
                "<p>Could not load contestants.</p>";

            return;

        }


        const contestants =
            await response.json();


        contestantList.innerHTML = "";


        if(contestants.length === 0){

            contestantList.innerHTML =
                "<p>No contestants have been registered for this contest yet.</p>";

            return;

        }


        contestants.forEach(
            function(contestant){

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "contestant";


                div.innerHTML = `

                    ${
                        contestant.photo
                        ?
                        `<img
                            src="${contestant.photo}"
                            alt="Contestant Photo"
                        >`
                        :
                        ""
                    }

                    <h3>
                        ${contestant.name}
                    </h3>

                    <p>
                        <strong>Contest:</strong>
                        ${contestant.contest}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${contestant.email || "Not provided"}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${contestant.phone || "Not provided"}
                    </p>

                    <p>
                        <strong>Votes:</strong>
                        ${contestant.votes || 0}
                    </p>

                `;


                contestantList.appendChild(
                    div
                );

            }
        );


    }catch(error){

        console.error(error);

        contestantList.innerHTML =
            "<p>Connection error.</p>";

    }

}


/* =========================
   CONTEST CHANGE
========================= */

contestSelect.addEventListener(
    "change",
    loadContestants
);


/* =========================
   START
========================= */

loadContests();

</script>

</body>
</html>
