<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VBC Votes - Contestants</title><style>

body{
    font-family:Arial,sans-serif;
    background:#eef3ff;
    margin:0;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
}

h1{
    text-align:center;
    color:#003399;
}

#contestSelect{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
    background:white;
}

.contestant{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

.contestant img{
    display:block;
    width:150px;
    height:150px;
    object-fit:cover;
    margin:0 auto 15px;
    border-radius:8px;
}

.contestant h3{
    color:#003399;
    text-align:center;
}

.contestant p{
    line-height:1.5;
}

.organization{
    background:#eef6ff;
    padding:10px;
    border-radius:6px;
    margin-bottom:15px;
    text-align:center;
    color:#0057B8;
    font-weight:bold;
}

.back{
    display:block;
    width:100%;
    padding:12px;
    background:#0066ff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    text-align:center;
    text-decoration:none;
    box-sizing:border-box;
    margin-top:20px;
}

#loading{
    text-align:center;
    padding:40px;
    font-size:18px;
}

#contestantList{
    min-height:40px;
}

</style></head><body><div id="loading">Checking admin access...

</div><div
    class="container"
    id="contestantsPage"
    style="display:none;"
><h1>
Registered Contestants
</h1><select id="contestSelect"><option value="">
    Select Contest
</option>

</select><div id="selectedContestInfo" style="display:none;"><div class="organization">
    🏢 Organization:
    <span id="organizationName"></span>
</div>

<div class="organization">
    🏆 Contest:
    <span id="selectedContestName"></span>
</div>

</div><div id="contestantList"><p>Please select a contest.</p>

</div><a
class="back"
href="dashboard.html">

← Back to Dashboard

</a></div><script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://dwedhbcsgfdqvurgnuvf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UP8hJISXy2-O_bpmmz3mow_ZqajzBeM";


/* =========================
   ELEMENTS
========================= */

const loading =
    document.getElementById("loading");

const contestantsPage =
    document.getElementById("contestantsPage");

const contestSelect =
    document.getElementById("contestSelect");

const contestantList =
    document.getElementById("contestantList");

const selectedContestInfo =
    document.getElementById("selectedContestInfo");

const organizationName =
    document.getElementById("organizationName");

const selectedContestName =
    document.getElementById("selectedContestName");


/*
   Store contest information locally
   so we don't need another Supabase
   request when a contest is selected.
*/

let contests = [];


/* =========================
   ADMIN AUTHENTICATION
========================= */

async function checkAdmin(){

    const token =
        localStorage.getItem(
            "vbc_access_token"
        );


    if(!token){

        window.location.href =
            "login.html";

        return;

    }


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/auth/v1/user",

                {
                    method:"GET",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            token

                    }

                }

            );


        if(!response.ok){

            localStorage.removeItem(
                "vbc_access_token"
            );

            localStorage.removeItem(
                "vbc_refresh_token"
            );

            localStorage.removeItem(
                "vbc_user_email"
            );

            window.location.href =
                "login.html";

            return;

        }


        /*
           Authentication successful.
           Show the page immediately.
        */

        loading.style.display =
            "none";

        contestantsPage.style.display =
            "block";


        /*
           Load contests after authentication.
        */

        await loadContests();


    }catch(error){

        console.error(
            "Authentication error:",
            error
        );

        loading.textContent =
            "Unable to verify admin access. Please try again.";

    }

}


/* =========================
   LOAD CONTESTS
========================= */

async function loadContests(){

    contestantList.innerHTML =
        "<p>Loading contests...</p>";


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/contests" +
                "?select=id,name,organization_name" +
                "&order=created_at.desc",

                {

                    method:"GET",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        if(!response.ok){

            const error =
                await response.text();

            console.error(
                "Contest error:",
                error
            );

            contestantList.innerHTML =
                "<p>Could not load contests.</p>";

            return;

        }


        contests =
            await response.json();


        contestSelect.innerHTML =
            '<option value="">Select Contest</option>';


        contests.forEach(
            function(contest){

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    contest.id;


                option.textContent =
                    contest.name;


                contestSelect.appendChild(
                    option
                );

            }
        );


        contestantList.innerHTML =
            "<p>Please select a contest.</p>";


    }catch(error){

        console.error(
            "Contest loading error:",
            error
        );

        contestantList.innerHTML =
            "<p>Connection error. Please try again.</p>";

    }

}


/* =========================
   SHOW CONTEST INFORMATION
========================= */

function showSelectedContestInfo(){

    const contestId =
        contestSelect.value;


    if(!contestId){

        selectedContestInfo.style.display =
            "none";

        return;

    }


    const selectedContest =
        contests.find(
            function(contest){

                return contest.id === contestId;

            }
        );


    if(!selectedContest){

        selectedContestInfo.style.display =
            "none";

        return;

    }


    organizationName.textContent =
        selectedContest.organization_name ||
        "Not provided";


    selectedContestName.textContent =
        selectedContest.name ||
        "Not provided";


    selectedContestInfo.style.display =
        "block";

}


/* =========================
   LOAD CONTESTANTS
========================= */

async function loadContestants(){

    const selectedContestId =
        contestSelect.value;


    if(!selectedContestId){

        contestantList.innerHTML =
            "<p>Please select a contest.</p>";

        return;

    }


    contestantList.innerHTML =
        "<p>Loading contestants...</p>";


    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/contestants" +
            "?select=id,name,phone,email,contest_id,contest,photo,votes" +
            "&contest_id=eq." +
            encodeURIComponent(
                selectedContestId
            ) +
            "&order=created_at.asc";


        const response =
            await fetch(

                url,

                {

                    method:"GET",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Accept":
                            "application/json"

                    }

                }

            );


        if(!response.ok){

            const error =
                await response.text();

            console.error(
                "Contestant error:",
                error
            );

            contestantList.innerHTML =
                "<p>Could not load contestants.</p>";

            return;

        }


        const contestants =
            await response.json();


        if(!contestants.length){

            contestantList.innerHTML =
                "<p>No contestants have been registered for this contest yet.</p>";

            return;

        }


        /*
           Build the complete page once.
           This is faster than repeatedly
           updating the DOM for every contestant.
        */

        const html =
            contestants.map(
                function(contestant){

                    return `

                        <div class="contestant">

                            ${
                                contestant.photo
                                ?
                                `
                                <img
                                    src="${contestant.photo}"
                                    alt="Contestant Photo"
                                    loading="lazy"
                                >
                                `
                                :
                                ""
                            }

                            <h3>
                                ${contestant.name || "Unnamed Contestant"}
                            </h3>

                            <p>
                                <strong>Contest:</strong>
                                ${contestant.contest || "Not provided"}
                            </p>

                            <p>
                                <strong>Email:</strong>
                                ${contestant.email || "Not provided"}
                            </p>

                            <p>
                                <strong>Phone:</strong>
                                ${contestant.phone || "Not provided"}
                            </p>

                            <p>
                                <strong>Votes:</strong>
                                ${contestant.votes || 0}
                            </p>

                        </div>

                    `;

                }
            ).join("");


        contestantList.innerHTML =
            html;


    }catch(error){

        console.error(
            "Contestant loading error:",
            error
        );

        contestantList.innerHTML =
            "<p>Connection error. Please try again.</p>";

    }

}


/* =========================
   CONTEST CHANGE
========================= */

contestSelect.addEventListener(
    "change",
    function(){

        showSelectedContestInfo();

        loadContestants();

    }
);


/* =========================
   START
========================= */

checkAdmin();


</script></body></html>
