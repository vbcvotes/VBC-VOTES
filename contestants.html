<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VBC Votes - Contestants</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef3ff;
    margin:0;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
}

h1{
    text-align:center;
    color:#003399;
}

#contestSelect{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

.contestant{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

.contestant img{
    display:block;
    width:150px;
    height:150px;
    object-fit:cover;
    margin:0 auto 15px;
    border-radius:8px;
}

.contestant h3{
    color:#003399;
    text-align:center;
}

.contestant p{
    line-height:1.5;
}

.organization{
    background:#eef6ff;
    padding:10px;
    border-radius:6px;
    margin-bottom:15px;
    text-align:center;
    color:#0057B8;
    font-weight:bold;
}

.back{
    display:block;
    width:100%;
    padding:12px;
    background:#0066ff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    text-align:center;
    text-decoration:none;
    box-sizing:border-box;
    margin-top:20px;
}

#loading{
    text-align:center;
    padding:40px;
    font-size:18px;
}

</style>

</head>


<body>


<div id="loading">
Checking admin access...
</div>


<div
    class="container"
    id="contestantsPage"
    style="display:none;"
>


<h1>
Registered Contestants
</h1>


<div
    class="organization"
    id="organizationDisplay">
</div>


<select id="contestSelect">

    <option value="">
        Select Contest
    </option>

</select>


<div id="contestantList">

    <p>Please select a contest.</p>

</div>


<a
    class="back"
    href="dashboard.html">

    ← Back to Dashboard

</a>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://dwedhbcsgfdqvurgnuvf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UP8hJISXy2-O_bpmmz3mow_ZqajzBeM";


/* =========================
   ELEMENTS
========================= */

const contestSelect =
    document.getElementById(
        "contestSelect"
    );

const contestantList =
    document.getElementById(
        "contestantList"
    );

const organizationDisplay =
    document.getElementById(
        "organizationDisplay"
    );


/* =========================
   ADMIN AUTHENTICATION
========================= */

async function checkAdmin(){

    const token =
        localStorage.getItem(
            "vbc_access_token"
        );

    const organization =
        localStorage.getItem(
            "vbc_organization_name"
        );


    if(!token || !organization){

        window.location.href =
            "login.html";

        return;

    }


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/auth/v1/user",

                {

                    method:"GET",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            token

                    }

                }

            );


        if(!response.ok){

            localStorage.removeItem(
                "vbc_access_token"
            );

            localStorage.removeItem(
                "vbc_refresh_token"
            );

            localStorage.removeItem(
                "vbc_user_email"
            );

            localStorage.removeItem(
                "vbc_organization_name"
            );

            window.location.href =
                "login.html";

            return;

        }


        organizationDisplay.textContent =
            "Organization: " +
            organization;


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "contestantsPage"
        ).style.display =
            "block";


        loadContests();


    }catch(error){

        console.error(error);

        window.location.href =
            "login.html";

    }

}


/* =========================
   LOAD ORGANIZATION CONTESTS
========================= */

async function loadContests(){

    const organization =
        localStorage.getItem(
            "vbc_organization_name"
        );


    try{

        const response =
            await fetch(

                SUPABASE_URL +

                "/rest/v1/contests" +

                "?select=id,name,organization_name" +

                "&organization_name=eq." +

                encodeURIComponent(
                    organization
                ) +

                "&order=id.asc",

                {

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        if(!response.ok){

            const error =
                await response.text();

            console.error(error);

            contestantList.innerHTML =
                "<p>Could not load contests.</p>";

            return;

        }


        const contests =
            await response.json();


        contestSelect.innerHTML =
            '<option value="">Select Contest</option>';


        contests.forEach(
            function(contest){

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    contest.id;


                option.textContent =
                    contest.name;


                option.dataset.name =
                    contest.name;


                contestSelect.appendChild(
                    option
                );

            }
        );


        if(contests.length === 0){

            contestantList.innerHTML =
                "<p>No contests have been created for this organization yet.</p>";

        }


    }catch(error){

        console.error(error);

        contestantList.innerHTML =
            "<p>Connection error.</p>";

    }

}


/* =========================
   LOAD CONTESTANTS
========================= */

async function loadContestants(){

    const selectedContestId =
        contestSelect.value;

    const organization =
        localStorage.getItem(
            "vbc_organization_name"
        );


    if(!selectedContestId){

        contestantList.innerHTML =
            "<p>Please select a contest.</p>";

        return;

    }


    contestantList.innerHTML =
        "<p>Loading contestants...</p>";


    try{

        const response =
            await fetch(

                SUPABASE_URL +

                "/rest/v1/contestants" +

                "?select=id,name,phone,email,contest_id,contest,photo,votes,organization_name" +

                "&contest_id=eq." +

                encodeURIComponent(
                    selectedContestId
                ) +

                "&organization_name=eq." +

                encodeURIComponent(
                    organization
                ) +

                "&order=id.asc",

                {

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        if(!response.ok){

            const error =
                await response.text();

            console.error(error);

            contestantList.innerHTML =
                "<p>Could not load contestants.</p>";

            return;

        }


        const contestants =
            await response.json();


        contestantList.innerHTML =
            "";


        if(contestants.length === 0){

            contestantList.innerHTML =
                "<p>No contestants have been registered for this contest yet.</p>";

            return;

        }


        const selectedOption =
            contestSelect.options[
                contestSelect.selectedIndex
            ];


        const selectedContestName =
            selectedOption
            ? selectedOption.dataset.name
            : "";


        contestants.forEach(
            function(contestant){

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "contestant";


                div.innerHTML = `

                    <div class="organization">

                        🏢 ${organization}

                        <br>

                        Contest:
                        ${selectedContestName}

                    </div>


                    ${
                        contestant.photo
                        ?
                        `<img
                            src="${contestant.photo}"
                            alt="Contestant Photo"
                        >`
                        :
                        ""
                    }


                    <h3>
                        ${contestant.name}
                    </h3>


                    <p>
                        <strong>Contest:</strong>
                        ${contestant.contest || "Not provided"}
                    </p>


                    <p>
                        <strong>Email:</strong>
                        ${contestant.email || "Not provided"}
                    </p>


                    <p>
                        <strong>Phone:</strong>
                        ${contestant.phone || "Not provided"}
                    </p>


                    <p>
                        <strong>Votes:</strong>
                        ${contestant.votes || 0}
                    </p>

                `;


                contestantList.appendChild(
                    div
                );

            }
        );


    }catch(error){

        console.error(error);

        contestantList.innerHTML =
            "<p>Connection error.</p>";

    }

}


/* =========================
   CONTEST CHANGE
========================= */

contestSelect.addEventListener(
    "change",
    loadContestants
);


/* =========================
   START
========================= */

checkAdmin();

</script>

</body>

</html>
