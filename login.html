<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | VBC Votes</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f8fc;
    margin:0;
    padding:20px;
}

.container{
    max-width:400px;
    margin:60px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0057B8;
}

p{
    text-align:center;
    color:#666;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#16a34a;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

#errorMessage{
    color:#d00000;
    text-align:center;
    margin-top:15px;
}

#successMessage{
    color:#16803a;
    text-align:center;
    margin-top:15px;
}
</style>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="container">

<h1>VBC Votes</h1>

<p>Admin / Organization Login</p>

<input
    type="email"
    id="email"
    placeholder="Email Address"
    autocomplete="email"
>

<input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
>

<button id="loginButton">
    Login
</button>

<div id="errorMessage"></div>
<div id="successMessage"></div>

</div>

<script>

const SUPABASE_URL =
    "https://dwedhbcsgfdqvurgnuvf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UP8hJISXy2-O_bpmmz3mow_ZqajzBeM";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const errorMessage =
    document.getElementById("errorMessage");

const successMessage =
    document.getElementById("successMessage");


loginButton.addEventListener(
    "click",
    async function(){

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        errorMessage.textContent = "";
        successMessage.textContent = "";

        if(!email || !password){

            errorMessage.textContent =
                "Please enter your email and password.";

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        try{

            const {
                data,
                error
            } =
            await supabaseClient.auth
                .signInWithPassword({
                    email: email,
                    password: password
                });


            if(error){

                errorMessage.textContent =
                    "Login failed: " +
                    error.message;

                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";

                return;
            }


            if(data && data.user){

                successMessage.textContent =
                    "Login successful. Opening dashboard...";

                setTimeout(function(){

                    window.location.href =
                        "dashboard.html";

                }, 700);

            }

        }catch(error){

            console.error(error);

            errorMessage.textContent =
                "Connection error. Please try again.";

            loginButton.disabled = false;

            loginButton.textContent =
                "Login";

        }

    }
);

</script>

</body>
</html>
