<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | VBC Votes</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f8fc;
    margin:0;
    padding:20px;
}

.container{
    max-width:400px;
    margin:60px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0057B8;
}

p{
    text-align:center;
    color:#666;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#16a34a;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    background:#999;
}

#errorMessage{
    color:#d00000;
    text-align:center;
    margin-top:15px;
}

#successMessage{
    color:#16803a;
    text-align:center;
    margin-top:15px;
}

</style>

</head>


<body>


<div class="container">


<h1>
VBC Votes
</h1>


<p>
Admin / Organization Login
</p>


<input
    type="text"
    id="organizationName"
    placeholder="Organization Name"
>


<input
    type="email"
    id="email"
    placeholder="Email Address"
>


<input
    type="password"
    id="password"
    placeholder="Password"
>


<button id="loginButton">
Login
</button>


<div id="errorMessage"></div>

<div id="successMessage"></div>


</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://dwedhbcsgfdqvurgnuvf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UP8hJISXy2-O_bpmmz3mow_ZqajzBeM";


/* =========================
   ELEMENTS
========================= */

const organizationInput =
    document.getElementById(
        "organizationName"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const successMessage =
    document.getElementById(
        "successMessage"
    );


/* =========================
   LOGIN
========================= */

loginButton.addEventListener(
    "click",
    async function(){

        const organization =
            organizationInput
            .value
            .trim();

        const email =
            emailInput
            .value
            .trim();

        const password =
            passwordInput
            .value;


        errorMessage.textContent =
            "";

        successMessage.textContent =
            "";


        /* =========================
           VALIDATION
        ========================= */

        if(
            !organization ||
            !email ||
            !password
        ){

            errorMessage.textContent =
                "Please enter your organization name, email and password.";

            return;

        }


        loginButton.disabled =
            true;

        loginButton.textContent =
            "Checking login...";


        try{


            /* =========================
               SUPABASE LOGIN
            ========================= */

            const response =
                await fetch(

                    SUPABASE_URL +
                    "/auth/v1/token?grant_type=password",

                    {

                        method:"POST",

                        headers:{

                            "Content-Type":
                                "application/json",

                            "apikey":
                                SUPABASE_KEY

                        },

                        body:JSON.stringify({

                            email:
                                email,

                            password:
                                password

                        })

                    }

                );


            const result =
                await response.json();


            console.log(
                "Supabase login:",
                result
            );


            /* =========================
               LOGIN ERROR
            ========================= */

            if(!response.ok){

                errorMessage.textContent =
                    result.error_description ||
                    result.msg ||
                    result.message ||
                    "Invalid email or password.";

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

                return;

            }


            /* =========================
               SAVE LOGIN INFORMATION
            ========================= */

            if(result.access_token){

                localStorage.setItem(
                    "vbc_access_token",
                    result.access_token
                );


                localStorage.setItem(
                    "vbc_refresh_token",
                    result.refresh_token || ""
                );


                localStorage.setItem(
                    "vbc_user_email",
                    email
                );


                /* =========================
                   SAVE ORGANIZATION
                ========================= */

                localStorage.setItem(
                    "vbc_organization_name",
                    organization
                );


                successMessage.textContent =
                    "Login successful!";


                setTimeout(
                    function(){

                        window.location.href =
                            "dashboard.html";

                    },
                    700
                );


            }else{

                errorMessage.textContent =
                    "Login failed. No access token received.";

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

            }


        }catch(error){

            console.error(error);


            errorMessage.textContent =
                "Connection error: " +
                error.message;


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

        }

    }
);

</script>


</body>

</html>
