<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Contestant - VBC VOTES</title>

<style>
body{
    font-family:Arial,sans-serif;
        background:#f4f4f4;
            margin:0;
                padding:20px;
                }

                .container{
                    max-width:500px;
                        margin:auto;
                            background:#fff;
                                padding:20px;
                                    border-radius:10px;
                                        box-shadow:0 0 10px rgba(0,0,0,.2);
                                        }

                                        h2{
                                            text-align:center;
                                                color:#0047AB;
                                                }

                                                input{
                                                    width:100%;
                                                        padding:12px;
                                                            margin:10px 0;
                                                                border:1px solid #ccc;
                                                                    border-radius:5px;
                                                                        box-sizing:border-box;
                                                                        }

                                                                        button{
                                                                            width:100%;
                                                                                padding:14px;
                                                                                    background:#0057ff;
                                                                                        color:white;
                                                                                            border:none;
                                                                                                border-radius:5px;
                                                                                                    font-size:18px;
                                                                                                        cursor:pointer;
                                                                                                        }

                                                                                                        button:hover{
                                                                                                            background:#003fb3;
                                                                                                            }

                                                                                                            .back{
                                                                                                                display:block;
                                                                                                                    text-align:center;
                                                                                                                        margin-top:20px;
                                                                                                                            text-decoration:none;
                                                                                                                                color:#0047AB;
                                                                                                                                    font-weight:bold;
                                                                                                                                    }
                                                                                                                                    </style>

                                                                                                                                    </head>
                                                                                                                                    <body>

                                                                                                                                    <div class="container">

                                                                                                                                    <h2>Register Contestant</h2>

                                                                                                                                    <form id="contestantForm">

                                                                                                                                    <input type="text" id="name" placeholder="Full Name" required>

                                                                                                                                    <input type="text" id="phone" placeholder="Phone Number" required>

                                                                                                                                    <input type="email" id="email" placeholder="Email Address" required>

                                                                                                                                    <input type="text" id="contest" placeholder="Contest Name" required>

                                                                                                                                    <input type="file" id="photo" accept="image/*">

                                                                                                                                    <button type="submit">Register Contestant</button>

                                                                                                                                    </form>

                                                                                                                                    <a class="back" href="dashboard.html">← Back to Dashboard</a>

                                                                                                                                    </div>

                                                                                                                                    <script>

                                                                                                                                    document.getElementById("contestantForm").addEventListener("submit",function(e){

                                                                                                                                    e.preventDefault();

                                                                                                                                    let contestants=JSON.parse(localStorage.getItem("contestants"))||[];

                                                                                                                                    const reader=new FileReader();

                                                                                                                                    const file=document.getElementById("photo").files[0];

                                                                                                                                    function saveContestant(image){

                                                                                                                                    contestants.push({

                                                                                                                                    name:document.getElementById("name").value,

                                                                                                                                    phone:document.getElementById("phone").value,

                                                                                                                                    email:document.getElementById("email").value,

                                                                                                                                    contest:document.getElementById("contest").value,

                                                                                                                                    photo:image,

                                                                                                                                    votes:0

                                                                                                                                    });

                                                                                                                                    localStorage.setItem("contestants",JSON.stringify(contestants));

                                                                                                                                    alert("Contestant Registered Successfully!");

                                                                                                                                    document.getElementById("contestantForm").reset();

                                                                                                                                    }

                                                                                                                                    if(file){

                                                                                                                                    reader.onload=function(){

                                                                                                                                    saveContestant(reader.result);

                                                                                                                                    };

                                                                                                                                    reader.readAsDataURL(file);

                                                                                                                                    }else{

                                                                                                                                    saveContestant("");

                                                                                                                                    }

                                                                                                                                    });

                                                                                                                                    </script>

                                                                                                                                    </body>
                                                                                                                                    </html>
