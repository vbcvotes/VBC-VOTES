<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VBC Votes - Results</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef3ff;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    color:#003399;
}

#contestSelect{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

.result{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

.result img{
    display:block;
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:8px;
    margin:auto;
}

.result h2{
    text-align:center;
    color:#003399;
}

.votes{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    color:#16a34a;
}

.rank{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.back{
    display:block;
    width:100%;
    padding:12px;
    background:#0066ff;
    color:white;
    border-radius:6px;
    text-align:center;
    text-decoration:none;
    box-sizing:border-box;
    margin-top:20px;
}

</style>

</head>


<body>

<div class="container">

<h1>
VBC Votes Results
</h1>


<select id="contestSelect">

    <option value="">
        Select Contest
    </option>

</select>


<div id="resultsList">

    <p>
        Please select a contest.
    </p>

</div>


<a
    class="back"
    href="dashboard.html">

    ← Back to Dashboard

</a>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://dwedhbcsgfdqvurgnuvf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UP8hJISXy2-O_bpmmz3mow_ZqajzBeM";


/* =========================
   ELEMENTS
========================= */

const contestSelect =
    document.getElementById(
        "contestSelect"
    );

const resultsList =
    document.getElementById(
        "resultsList"
    );


/* =========================
   LOAD CONTESTS
========================= */

async function loadContests(){

    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/contests?select=id,name&order=id.asc",

                {
                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }

            );


        if(!response.ok){

            const error =
                await response.text();

            console.error(error);

            resultsList.innerHTML =
                "<p>Could not load contests.</p>";

            return;

        }


        const contests =
            await response.json();


        contests.forEach(
            function(contest){

                const option =
                    document.createElement(
                        "option"
                    );


                /*
                Use the contest ID,
                not the contest name.
                */

                option.value =
                    contest.id;


                option.textContent =
                    contest.name;


                contestSelect.appendChild(
                    option
                );

            }
        );


    }catch(error){

        console.error(error);

        resultsList.innerHTML =
            "<p>Connection error.</p>";

    }

}


/* =========================
   LOAD RESULTS
========================= */

async function showResults(){

    const contestId =
        contestSelect.value;


    resultsList.innerHTML =
        "";


    if(!contestId){

        resultsList.innerHTML =
            "<p>Please select a contest.</p>";

        return;

    }


    resultsList.innerHTML =
        "<p>Loading live results...</p>";


    try{

        const response =
            await fetch(

                SUPABASE_URL +

                "/rest/v1/contestants" +

                "?select=id,name,photo,votes,contest" +

                "&contest_id=eq." +

                encodeURIComponent(
                    contestId
                ) +

                "&order=votes.desc,id.asc",

                {
                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        if(!response.ok){

            const error =
                await response.text();

            console.error(error);

            resultsList.innerHTML =
                "<p>Could not load results.</p>";

            return;

        }


        const contestants =
            await response.json();


        resultsList.innerHTML =
            "";


        if(
            contestants.length === 0
        ){

            resultsList.innerHTML =
                "<p>No contestants found for this contest.</p>";

            return;

        }


        contestants.forEach(
            function(
                contestant,
                index
            ){

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "result";


                const votes =
                    Number(
                        contestant.votes || 0
                    );


                div.innerHTML = `

                    <div class="rank">

                        Rank ${index + 1}

                    </div>


                    ${
                        contestant.photo

                        ?

                        `<img
                            src="${contestant.photo}"
                            alt="Contestant Photo"
                        >`

                        :

                        ""
                    }


                    <h2>

                        ${contestant.name}

                    </h2>


                    <div class="votes">

                        Votes: ${votes.toLocaleString()}

                    </div>

                `;


                resultsList.appendChild(
                    div
                );

            }
        );


    }catch(error){

        console.error(error);

        resultsList.innerHTML =
            "<p>Connection error.</p>";

    }

}


/* =========================
   CONTEST CHANGE
========================= */

contestSelect.addEventListener(
    "change",
    showResults
);


/* =========================
   START
========================= */

loadContests();

</script>

</body>

</html>
