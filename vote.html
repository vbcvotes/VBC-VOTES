<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vote | VBC Votes</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef3ff;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    color:#003399;
}

#contestSelect{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

#contestInfo{
    background:white;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 8px rgba(0,0,0,.10);
    display:none;
}

#contestInfo h3{
    margin:5px 0;
    color:#003399;
}

#contestInfo p{
    margin:5px 0;
}

.contestant{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
    text-align:center;
}

.contestant img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:8px;
}

.contestant h2{
    color:#003399;
}

.voteButton{
    width:100%;
    padding:13px;
    background:#18a84b;
    color:white;
    border:none;
    border-radius:6px;
    font-size:17px;
    cursor:pointer;
}

.voteButton:hover{
    background:#12843a;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#003399;
    font-weight:bold;
    text-decoration:none;
}


/* =========================
   VOTING FORM
========================= */

#votingPanel{
    display:none;
    background:white;
    padding:25px;
    margin-top:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

#votingPanel h2{
    text-align:center;
    color:#003399;
}

.selectedContestant{
    text-align:center;
    margin-bottom:20px;
}

.selectedContestant img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:8px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:6px;
}

#totalAmount{
    margin-top:20px;
    padding:15px;
    background:#eef3ff;
    border-radius:6px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#003399;
}

.payButton{
    width:100%;
    padding:14px;
    margin-top:15px;
    background:#0066ff;
    color:white;
    border:none;
    border-radius:6px;
    font-size:17px;
    cursor:pointer;
}

.payButton:disabled{
    background:#888;
    cursor:not-allowed;
}

.cancelButton{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#777;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

</style>

</head>


<body>

<div class="container">

<h1>VBC Votes</h1>


<!-- =========================
     CONTEST SELECT
========================= -->

<select id="contestSelect">

    <option value="">
        Select Contest
    </option>

</select>


<!-- =========================
     CONTEST INFORMATION
========================= -->

<div id="contestInfo">

    <h3 id="contestName"></h3>

    <p id="organizationName"></p>

    <p id="votePrice"></p>

</div>


<!-- =========================
     CONTESTANTS
========================= -->

<div id="contestantsList"></div>


<!-- =========================
     VOTING PANEL
========================= -->

<div id="votingPanel">

    <h2>Cast Your Vote</h2>


    <div
        id="selectedContestant"
        class="selectedContestant">
    </div>


    <label for="voterName">
        Voter Name
    </label>

    <input
        type="text"
        id="voterName"
        placeholder="Enter your name"
    >


    <label for="voterEmail">
        Email Address
    </label>

    <input
        type="email"
        id="voterEmail"
        placeholder="Enter your email address"
    >


    <label for="voterPhone">
        Phone Number
    </label>

    <input
        type="tel"
        id="voterPhone"
        placeholder="Enter your phone number"
    >


    <label for="voteAmount">
        Choose Number of Votes
    </label>

    <select id="voteAmount">

        <option value="">
            Select Number of Votes
        </option>

        <option value="1">
            1 Vote
        </option>

        <option value="2">
            2 Votes
        </option>

        <option value="3">
            3 Votes
        </option>

        <option value="10">
            10 Votes
        </option>

        <option value="50">
            50 Votes
        </option>

        <option value="100">
            100 Votes
        </option>

        <option value="500">
            500 Votes
        </option>

        <option value="1000">
            1,000 Votes
        </option>

    </select>


    <div id="totalAmount">

        Total: ₦0

    </div>


    <button
        class="payButton"
        id="payButton">

        Proceed to Payment

    </button>


    <button
        class="cancelButton"
        id="cancelButton">

        Cancel

    </button>

</div>


<a
    class="back"
    href="index.html">

    ← Back

</a>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://dwedhbcsgfdqvurgnuvf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UP8hJISXy2-O_bpmmz3mow_ZqajzBeM";


/* =========================
   ELEMENTS
========================= */

const contestSelect =
    document.getElementById(
        "contestSelect"
    );

const contestInfo =
    document.getElementById(
        "contestInfo"
    );

const contestName =
    document.getElementById(
        "contestName"
    );

const organizationName =
    document.getElementById(
        "organizationName"
    );

const votePrice =
    document.getElementById(
        "votePrice"
    );

const contestantsList =
    document.getElementById(
        "contestantsList"
    );

const votingPanel =
    document.getElementById(
        "votingPanel"
    );

const selectedContestant =
    document.getElementById(
        "selectedContestant"
    );

const voterName =
    document.getElementById(
        "voterName"
    );

const voterEmail =
    document.getElementById(
        "voterEmail"
    );

const voterPhone =
    document.getElementById(
        "voterPhone"
    );

const voteAmount =
    document.getElementById(
        "voteAmount"
    );

const totalAmount =
    document.getElementById(
        "totalAmount"
    );

const payButton =
    document.getElementById(
        "payButton"
    );

const cancelButton =
    document.getElementById(
        "cancelButton"
    );


/* =========================
   CURRENT DATA
========================= */

let currentContest = null;

let currentContestant = null;


/* =========================
   SUPABASE HEADERS
========================= */

function supabaseHeaders(){

    return {

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " + SUPABASE_KEY

    };

}


/* =========================
   LOAD CONTESTS
========================= */

async function loadContests(){

    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/contests" +
                "?select=id,name,organization_name,organization_id,vote_price" +
                "&order=created_at.desc",

                {
                    headers:
                        supabaseHeaders()
                }

            );


        if(!response.ok){

            const error =
                await response.text();

            console.error(error);

            alert(
                "Could not load contests."
            );

            return;

        }


        const contests =
            await response.json();


        contests.forEach(
            function(contest){

                const option =
                    document.createElement(
                        "option"
                    );


                /*
                 * IMPORTANT:
                 * VALUE IS NOW CONTEST ID
                 */

                option.value =
                    contest.id;


                option.textContent =
                    contest.name;


                contestSelect.appendChild(
                    option
                );

            }
        );


    }catch(error){

        console.error(error);

        alert(
            "Connection error while loading contests."
        );

    }

}


/* =========================
   LOAD SELECTED CONTEST
========================= */

async function getSelectedContest(
    contestId
){

    const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/contests" +
            "?id=eq." +
            encodeURIComponent(contestId) +
            "&select=id,name,organization_name,organization_id,vote_price",

            {
                headers:
                    supabaseHeaders()
            }

        );


    if(!response.ok){

        throw new Error(
            "Could not load contest."
        );

    }


    const contests =
        await response.json();


    if(!contests.length){

        throw new Error(
            "Contest not found."
        );

    }


    return contests[0];

}


/* =========================
   LOAD CONTESTANTS
========================= */

async function loadContestants(
    contestId
){

    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/contestants" +
                "?contest_id=eq." +
                encodeURIComponent(contestId) +
                "&select=id,name,contest_id,photo" +
                "&order=created_at.asc",

                {
                    headers:
                        supabaseHeaders()
                }

            );


        if(!response.ok){

            const error =
                await response.text();

            console.error(error);

            alert(
                "Could not load contestants."
            );

            return [];

        }


        return await response.json();


    }catch(error){

        console.error(error);

        alert(
            "Connection error."
        );

        return [];

    }

}


/* =========================
   SHOW CONTESTANTS
========================= */

async function showContestants(){

    const contestId =
        contestSelect.value;


    contestantsList.innerHTML =
        "";

    votingPanel.style.display =
        "none";


    contestInfo.style.display =
        "none";


    currentContest =
        null;

    currentContestant =
        null;


    if(!contestId){

        contestantsList.innerHTML =
            "<p>Please select a contest.</p>";

        return;

    }


    contestantsList.innerHTML =
        "<p>Loading contest...</p>";


    try{

        currentContest =
            await getSelectedContest(
                contestId
            );


        /*
         * DISPLAY CONTEST DETAILS
         */

        contestName.textContent =
            currentContest.name;


        organizationName.textContent =
            "Organisation: " +
            (
                currentContest.organization_name
                ||
                "VBC Votes"
            );


        const price =
            Number(
                currentContest.vote_price
                || 100
            );


        votePrice.textContent =
            "Price per vote: ₦" +
            price.toLocaleString();


        contestInfo.style.display =
            "block";


        contestantsList.innerHTML =
            "<p>Loading contestants...</p>";


        const contestants =
            await loadContestants(
                contestId
            );


        contestantsList.innerHTML =
            "";


        if(!contestants.length){

            contestantsList.innerHTML =
                "<p>No contestants registered for this contest.</p>";

            return;

        }


        contestants.forEach(
            function(contestant){

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "contestant";


                div.innerHTML = `

                    ${
                        contestant.photo
                        ?
                        `<img
                            src="${contestant.photo}"
                            alt="Contestant Photo"
                        >`
                        :
                        ""
                    }

                    <h2>
                        ${contestant.name}
                    </h2>

                    <button
                        class="voteButton">

                        Vote Now

                    </button>

                `;


                const voteButton =
                    div.querySelector(
                        ".voteButton"
                    );


                voteButton.addEventListener(
                    "click",
                    function(){

                        openVotingPanel(
                            contestant
                        );

                    }
                );


                contestantsList.appendChild(
                    div
                );

            }
        );


    }catch(error){

        console.error(error);

        contestantsList.innerHTML =
            "<p>Unable to load this contest.</p>";

    }

}


/* =========================
   OPEN VOTING PANEL
========================= */

function openVotingPanel(
    contestant
){

    currentContestant =
        contestant;


    selectedContestant.innerHTML = `

        ${
            contestant.photo
            ?
            `<img
                src="${contestant.photo}"
                alt="Contestant Photo"
            >`
            :
            ""
        }

        <h3>
            Voting for:
            ${contestant.name}
        </h3>

    `;


    voterName.value =
        "";

    voterEmail.value =
        "";

    voterPhone.value =
        "";

    voteAmount.value =
        "";

    totalAmount.textContent =
        "Total: ₦0";


    votingPanel.style.display =
        "block";


    votingPanel.scrollIntoView({
        behavior:"smooth"
    });

}


/* =========================
   CALCULATE AMOUNT
========================= */

voteAmount.addEventListener(
    "change",
    function(){

        const votes =
            Number(
                voteAmount.value
            );


        const price =
            Number(
                currentContest?.vote_price
                || 100
            );


        const amount =
            votes * price;


        totalAmount.textContent =
            "Total: ₦" +
            amount.toLocaleString();

    }
);


/* =========================
   PAYSTACK PAYMENT
========================= */

payButton.addEventListener(
    "click",
    async function(){

        const name =
            voterName.value.trim();


        const email =
            voterEmail.value.trim();


        const phone =
            voterPhone.value.trim();


        const votes =
            Number(
                voteAmount.value
            );


        if(!currentContest){

            alert(
                "Please select a contest."
            );

            return;

        }


        if(!currentContestant){

            alert(
                "Please select a contestant."
            );

            return;

        }


        if(!name){

            alert(
                "Please enter your name."
            );

            voterName.focus();

            return;

        }


        if(!email){

            alert(
                "Please enter your email address."
            );

            voterEmail.focus();

            return;

        }


        if(!email.includes("@")){

            alert(
                "Please enter a valid email address."
            );

            voterEmail.focus();

            return;

        }


        if(!votes){

            alert(
                "Please select the number of votes."
            );

            return;

        }


        payButton.disabled =
            true;

        payButton.textContent =
            "Connecting to Paystack...";


        try{

            const response =
                await fetch(

                    SUPABASE_URL +
                    "/functions/v1/smart-responder",

                    {

                        method:"POST",

                        headers:{

                            "Content-Type":
                                "application/json",

                            "apikey":
                                SUPABASE_KEY

                        },


                        body:
                            JSON.stringify({

                                contestId:
                                    currentContest.id,

                                organizationId:
                                    currentContest.organization_id,

                                contestantId:
                                    currentContestant.id,

                                contestantName:
                                    currentContestant.name,

                                votes:
                                    votes,

                                voterName:
                                    name,

                                voterEmail:
                                    email,

                                voterPhone:
                                    phone

                            })

                    }

                );


            const result =
                await response.json();


            console.log(
                "Payment response:",
                result
            );


            if(

                result.status &&
                result.data &&
                result.data.authorization_url

            ){

                window.location.href =
                    result.data.authorization_url;

                return;

            }


            alert(

                "Unable to start payment.\n\n" +
                JSON.stringify(result)

            );


        }catch(error){

            console.error(error);

            alert(

                "Payment connection failed.\n\n" +
                error.message

            );

        }finally{

            payButton.disabled =
                false;

            payButton.textContent =
                "Proceed to Payment";

        }

    }
);


/* =========================
   CANCEL
========================= */

cancelButton.addEventListener(
    "click",
    function(){

        votingPanel.style.display =
            "none";

        currentContestant =
            null;

    }
);


/* =========================
   CONTEST CHANGE
========================= */

contestSelect.addEventListener(
    "change",
    showContestants
);


/* =========================
   START
========================= */

loadContests();

</script>

</body>
</html>
