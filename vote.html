<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vote | VBC Votes</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef3ff;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    color:#003399;
}

#contestSelect{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

.contestant{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
    text-align:center;
}

.contestant img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:8px;
}

.contestant h2{
    color:#003399;
}

.voteButton{
    width:100%;
    padding:13px;
    background:#18a84b;
    color:white;
    border:none;
    border-radius:6px;
    font-size:17px;
    cursor:pointer;
}

.voteButton:hover{
    background:#12843a;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#003399;
    font-weight:bold;
    text-decoration:none;
}


/* =========================
   VOTING FORM
========================= */

#votingPanel{
    display:none;
    background:white;
    padding:25px;
    margin-top:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

#votingPanel h2{
    text-align:center;
    color:#003399;
}

.selectedContestant{
    text-align:center;
    margin-bottom:20px;
}

.selectedContestant img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:8px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input, select{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:6px;
}

#totalAmount{
    margin-top:20px;
    padding:15px;
    background:#eef3ff;
    border-radius:6px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#003399;
}

.payButton{
    width:100%;
    padding:14px;
    margin-top:15px;
    background:#0066ff;
    color:white;
    border:none;
    border-radius:6px;
    font-size:17px;
    cursor:pointer;
}

.cancelButton{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#777;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

</style>
<script src="https://js.paystack.co/v2/inline.js"></script>
</head>


<body>

<div class="container">

<h1>VBC Votes</h1>


<select id="contestSelect">

    <option value="">
        Select Contest
    </option>

</select>


<div id="contestantsList"></div>


<!-- =========================
     VOTING PANEL
========================= -->

<div id="votingPanel">

    <h2>Cast Your Vote</h2>


    <div
        id="selectedContestant"
        class="selectedContestant">
    </div>


    <label for="voterContact">
        Phone Number / Email
    </label>

    <input
        type="text"
        id="voterContact"
        placeholder="Enter phone number or email"
    >


    <label for="voteAmount">
        Choose Number of Votes
    </label>

    <select id="voteAmount">

        <option value="">
            Select Number of Votes
        </option>

        <option value="1">
            1 Vote — ₦100
        </option>

        <option value="2">
            2 Votes — ₦200
        </option>

        <option value="3">
            3 Votes — ₦300
        </option>

        <option value="10">
            10 Votes — ₦1,000
        </option>

        <option value="50">
            50 Votes — ₦5,000
        </option>

        <option value="100">
            100 Votes — ₦10,000
        </option>

        <option value="500">
            500 Votes — ₦50,000
        </option>

        <option value="1000">
            1,000 Votes — ₦100,000
        </option>

    </select>


    <div id="totalAmount">

        Total: ₦0

    </div>


    <button
        class="payButton"
        id="payButton">

        Proceed to Payment

    </button>


    <button
        class="cancelButton"
        id="cancelButton">

        Cancel

    </button>

</div>


<a
    class="back"
    href="index.html">

    ← Back

</a>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://dwedhbcsgfdqvurgnuvf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UP8hJISXy2-O_bpmmz3mow_ZqajzBeM";


/* =========================
   ELEMENTS
========================= */

const contestSelect =
    document.getElementById(
        "contestSelect"
    );

const contestantsList =
    document.getElementById(
        "contestantsList"
    );

const votingPanel =
    document.getElementById(
        "votingPanel"
    );

const selectedContestant =
    document.getElementById(
        "selectedContestant"
    );

const voterContact =
    document.getElementById(
        "voterContact"
    );

const voteAmount =
    document.getElementById(
        "voteAmount"
    );

const totalAmount =
    document.getElementById(
        "totalAmount"
    );

const payButton =
    document.getElementById(
        "payButton"
    );

const cancelButton =
    document.getElementById(
        "cancelButton"
    );


let currentContestant = null;


/* =========================
   LOAD CONTESTS
========================= */

async function loadContests(){

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/contests?select=id,name&order=id.asc",
                {
                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        if(!response.ok){

            const error =
                await response.text();

            alert(
                "Could not load contests: " +
                error
            );

            return;
        }


        const contests =
            await response.json();


        contests.forEach(
            function(contest){

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    contest.name;

                option.textContent =
                    contest.name;

                contestSelect.appendChild(
                    option
                );

            }
        );


    }catch(error){

        console.error(error);

        alert(
            "Connection error."
        );

    }

}


/* =========================
   LOAD CONTESTANTS
========================= */

async function loadContestants(){

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/contestants?select=id,name,contest,photo&order=id.asc",
                {
                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        if(!response.ok){

            const error =
                await response.text();

            alert(
                "Could not load contestants: " +
                error
            );

            return [];

        }


        return await response.json();


    }catch(error){

        console.error(error);

        alert(
            "Connection error."
        );

        return [];

    }

}


/* =========================
   SHOW CONTESTANTS
========================= */

async function showContestants(){

    const selectedContest =
        contestSelect.value;


    contestantsList.innerHTML = "";


    votingPanel.style.display =
        "none";


    if(!selectedContest){

        contestantsList.innerHTML =
            "<p>Please select a contest.</p>";

        return;

    }


    contestantsList.innerHTML =
        "<p>Loading contestants...</p>";


    const contestants =
        await loadContestants();


    contestantsList.innerHTML = "";


    const filtered =
        contestants.filter(
            function(contestant){

                return contestant.contest ===
                    selectedContest;

            }
        );


    if(filtered.length === 0){

        contestantsList.innerHTML =
            "<p>No contestants registered for this contest.</p>";

        return;

    }


    filtered.forEach(
        function(contestant){

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "contestant";


            div.innerHTML = `

                ${
                    contestant.photo
                    ?
                    `<img
                        src="${contestant.photo}"
                        alt="Contestant Photo"
                    >`
                    :
                    ""
                }

                <h2>
                    ${contestant.name}
                </h2>

                <button
                    class="voteButton">

                    Vote Now

                </button>

            `;


            const voteButton =
                div.querySelector(
                    ".voteButton"
                );


            voteButton.addEventListener(
                "click",
                function(){

                    openVotingPanel(
                        contestant
                    );

                }
            );


            contestantsList.appendChild(
                div
            );

        }
    );

}


/* =========================
   OPEN VOTING PANEL
========================= */

function openVotingPanel(
    contestant
){

    currentContestant =
        contestant;


    selectedContestant.innerHTML = `

        ${
            contestant.photo
            ?
            `<img
                src="${contestant.photo}"
                alt="Contestant Photo"
            >`
            :
            ""
        }

        <h3>
            Voting for:
            ${contestant.name}
        </h3>

    `;


    voterContact.value = "";

    voteAmount.value = "";

    totalAmount.textContent =
        "Total: ₦0";


    votingPanel.style.display =
        "block";


    votingPanel.scrollIntoView({
        behavior:"smooth"
    });

}


/* =========================
   CALCULATE AMOUNT
========================= */

voteAmount.addEventListener(
    "change",
    function(){

        const votes =
            Number(
                voteAmount.value
            );


        const amount =
            votes * 100;


        totalAmount.textContent =
            "Total: ₦" +
            amount.toLocaleString();

    }
);

/* =========================
   PAYSTACK PAYMENT
========================= */

const SUPABASE_FUNCTION_URL =
    "https://dwedhbcsgfdqvurgnuvf.supabase.co/functions/v1/smart-responder";

payButton.addEventListener(
    "click",
    async function(){

        const contact =
            voterContact.value.trim();

        const votes =
            Number(voteAmount.value);

        if(!contact){

            alert(
                "Please enter your phone number or email."
            );

            return;
        }

        if(!votes){

            alert(
                "Please select the number of votes."
            );

            return;
        }

        if(!currentContestant){

            alert(
                "Please select a contestant."
            );

            return;
        }

        const amount =
            votes * 100;

        const email =
            contact.includes("@")
            ? contact
            : "voter" +
              Date.now() +
              "@vbcvotes.com";

        payButton.disabled = true;

        payButton.textContent =
            "Connecting to Paystack...";

        try{

            const response =
                await fetch(
                    SUPABASE_FUNCTION_URL,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            email:email,

                            amount:amount,

                            contestantId:
                                currentContestant.id,

                            contestantName:
                                currentContestant.name,

                            votes:votes,

                            contest:
                                contestSelect.value

                        })
                    }
                );


            const result =
                await response.json();


            if(!response.ok){

                throw new Error(
                    result.error ||
                    "Payment initialization failed."
                );

            }


            if(
                result.status &&
                result.data &&
                result.data.authorization_url
            ){

                window.location.href =
                    result.data.authorization_url;

                return;

            }


            throw new Error(
                "Paystack did not return a payment link."
            );


        }catch(error){

            console.error(error);

            alert(
                "Unable to start payment.\n\n" +
                error.message
            );

        }finally{

            payButton.disabled = false;

            payButton.textContent =
                "Proceed to Payment";

        }

    }
);


/* =========================
   CANCEL
========================= */

cancelButton.addEventListener(
    "click",
    function(){

        votingPanel.style.display =
            "none";

        currentContestant =
            null;

    }
);


/* =========================
   CONTEST CHANGE
========================= */

contestSelect.addEventListener(
    "change",
    showContestants
);


/* =========================
   START
========================= */

loadContests();

</script>

</body>
</html>
