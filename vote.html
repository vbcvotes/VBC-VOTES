<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vote | VBC Votes</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#eef3ff;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    color:#003399;
}

#contestSelect{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

.contestant{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
    text-align:center;
}

.contestant img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:8px;
}

.contestant h2{
    color:#003399;
}

.voteButton{
    width:100%;
    padding:13px;
    background:#18a84b;
    color:white;
    border:none;
    border-radius:6px;
    font-size:17px;
    cursor:pointer;
}

.voteButton:hover{
    background:#12843a;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#003399;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>VBC Votes</h1>

<select id="contestSelect">
    <option value="">Select Contest</option>
</select>

<div id="contestantsList"></div>

<a class="back" href="index.html">
← Back
</a>

</div>

<script>

const SUPABASE_URL =
    "https://dwedhbcsgfdqvurgnuvf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_UP8hJISXy2-O_bpmmz3mow_ZqajzBeM";


const contestSelect =
    document.getElementById("contestSelect");

const contestantsList =
    document.getElementById("contestantsList");


/* =========================
   LOAD CONTESTS
========================= */

async function loadContests() {

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/contests?select=id,name&order=created_at.desc",
            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }
            }
        );


        if (!response.ok) {

            const error =
                await response.text();

            alert(
                "Could not load contests: " +
                error
            );

            return;
        }


        const contests =
            await response.json();


        contestSelect.innerHTML =
            '<option value="">Select Contest</option>';


        contests.forEach(function(contest) {

            const option =
                document.createElement("option");

            option.value = contest.name;

            option.textContent = contest.name;

            contestSelect.appendChild(option);

        });


    } catch (error) {

        console.error(error);

        alert(
            "Connection error while loading contests."
        );

    }

}


/* =========================
   LOAD CONTESTANTS
========================= */

async function loadContestants() {

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/contestants?select=id,name,contest,photo&order=id.asc",
            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }
            }
        );


        if (!response.ok) {

            const error =
                await response.text();

            alert(
                "Could not load contestants: " +
                error
            );

            return [];

        }


        return await response.json();


    } catch (error) {

        console.error(error);

        alert(
            "Connection error while loading contestants."
        );

        return [];

    }

}


/* =========================
   GET VOTE COUNTS
========================= */

async function getVoteCounts() {

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/votes?select=contestant_id",
            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                }
            }
        );


        if (!response.ok) {

            const error =
                await response.text();

            alert(
                "Could not load votes: " +
                error
            );

            return {};

        }


        const votes =
            await response.json();


        const counts = {};


        votes.forEach(function(vote) {

            const id =
                String(vote.contestant_id);

            if (!counts[id]) {

                counts[id] = 0;

            }

            counts[id]++;

        });


        return counts;


    } catch (error) {

        console.error(error);

        alert(
            "Connection error while loading votes."
        );

        return {};

    }

}


/* =========================
   DISPLAY CONTESTANTS
========================= */

async function showContestants() {

    const selectedContest =
        contestSelect.value;


    contestantsList.innerHTML = "";


    if (!selectedContest) {

        contestantsList.innerHTML =
            "<p>Please select a contest.</p>";

        return;

    }


    contestantsList.innerHTML =
        "<p>Loading contestants...</p>";


    const contestants =
        await loadContestants();


    const voteCounts =
        await getVoteCounts();


    const filtered =
        contestants.filter(function(contestant) {

            return contestant.contest === selectedContest;

        });


    contestantsList.innerHTML = "";


    if (filtered.length === 0) {

        contestantsList.innerHTML =
            "<p>No contestants registered for this contest.</p>";

        return;

    }


    filtered.forEach(function(contestant) {

        const voteCount =
            voteCounts[String(contestant.id)] || 0;


        const div =
            document.createElement("div");


        div.className = "contestant";


        div.innerHTML = `

            ${
                contestant.photo
                ? `<img src="${contestant.photo}" alt="Contestant Photo">`
                : ""
            }

            <h2>${contestant.name}</h2>

            <p>
                Votes:
                <strong>${voteCount}</strong>
            </p>

            <button class="voteButton">
                Vote
            </button>

        `;


        const voteButton =
            div.querySelector(".voteButton");


        voteButton.addEventListener(
            "click",
            function() {

                castVote(
                    contestant.id,
                    voteButton
                );

            }
        );


        contestantsList.appendChild(div);

    });

}


/* =========================
   CAST VOTE
========================= */

async function castVote(
    contestantId,
    voteButton
) {

    voteButton.disabled = true;

    voteButton.textContent =
        "Submitting...";


    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/votes",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Prefer":
                        "return=minimal"

                },

                body:
                    JSON.stringify({

                        contestant_id:
                            contestantId

                    })

            }
        );


        if (!response.ok) {

            const error =
                await response.text();

            alert(
                "Vote failed: " +
                error
            );

            voteButton.disabled = false;

            voteButton.textContent =
                "Vote";

            return;

        }


        alert(
            "Vote recorded successfully!"
        );


        showContestants();


    } catch (error) {

        console.error(error);

        alert(
            "Connection error while voting."
        );


        voteButton.disabled = false;

        voteButton.textContent =
            "Vote";

    }

}


/* =========================
   CONTEST CHANGE
========================= */

contestSelect.addEventListener(
    "change",
    showContestants
);


/* =========================
   START PAGE
========================= */

loadContests();

</script>

</body>
</html>
