const contestSelect =

/* =========================

/* =========================
   SUPABASE HEADERS
========================= */

function supabaseHeaders(){
    return {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
    };
}


/* =========================
   PAYMENT MESSAGE
========================= */

function showPaymentMessage(message, color){

    paymentMessage.textContent = message;
    paymentMessage.style.display = "block";
    paymentMessage.style.color = color || "#003399";

    paymentMessage.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });
}


/* =========================
   VERIFY RETURNED PAYMENT
========================= */

async function verifyPaymentReturn(){

    const params = new URLSearchParams(
        window.location.search
    );

    const reference = params.get("reference");

    if(!reference){
        return;
    }

    showPaymentMessage(
        "Checking your payment. Please wait...",
        "#003399"
    );

    try{

        const response = await fetch(
            FUNCTION_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "apikey":SUPABASE_KEY
                },
                body:JSON.stringify({
                    action:"verify_payment",
                    reference:reference
                })
            }
        );

        let result;

        try{
            result = await response.json();
        }catch{
            throw new Error(
                "The server returned an unreadable response."
            );
        }

        console.log(
            "Payment verification result:",
            result
        );

        if(
            result.status === true &&
            result.payment_status === "success"
        ){

            if(result.duplicate === true){

                showPaymentMessage(
                    "This payment has already been recorded. No extra votes were added.",
                    "#12843a"
                );

            }else if(result.credited === true){

                showPaymentMessage(
                    "Payment successful! Your votes have been recorded successfully.",
                    "#12843a"
                );

            }else{

                showPaymentMessage(
                    "Payment was successful, but vote recording needs confirmation. Please contact support with reference: " + reference,
                    "#b36b00"
                );

            }

        }else if(
            result.payment_status === "pending"
        ){

            showPaymentMessage(
                "Your payment is still being processed. Please refresh this page shortly to check again.",
                "#b36b00"
            );

        }else if(
            result.payment_status === "failed" ||
            result.payment_status === "abandoned" ||
            result.payment_status === "reversed"
        ){

            showPaymentMessage(
                "Payment was not completed successfully. No votes were added. You may try again.",
                "#cc0000"
            );

        }else if(
            result.payment_status === "review"
        ){

            showPaymentMessage(
                "Your payment requires manual review. Please contact VBC Votes support and provide reference: " + reference,
                "#b36b00"
            );

        }else{

            showPaymentMessage(
                result.error ||
                "We could not confirm this payment. Please try again shortly. Reference: " + reference,
                "#cc0000"
            );

        }

    }catch(error){

        console.error(
            "Payment verification error:",
            error
        );

        showPaymentMessage(
            "Unable to verify your payment right now. Please refresh this page to try again. Reference: " + reference,
            "#cc0000"
        );

    }

}


/* =========================
   LOAD CONTESTS
========================= */
async function loadContests(){

    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/contests" +
            "?select=id,name,organization_name,organization_id,vote_price" +
            "&order=created_at.desc";

        const response = await fetch(url, {
            method: "GET",
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY,
                "Accept": "application/json"
            }
        });

        if(!response.ok){

            const errorText = await response.text();

            console.error("Supabase error:", errorText);

            alert("Could not load contests: " + errorText);

            return;
        }

        const contests = await response.json();

        contestSelect.innerHTML =
            '<option value="">Select Contest</option>';

        contests.forEach(function(contest){

            const option = document.createElement("option");

            option.value = contest.id;
            option.textContent = contest.name;

            contestSelect.appendChild(option);

        });

    }catch(error){

        console.error(error);

        alert("Connection error while loading contests.");

    }

            console.error(await response.text());

            return;
        }

        contests.forEach(function(contest){

            option.value = contest.id;

        });

    }catch(error){

/* =========================
   LOAD SELECTED CONTEST
========================= */

async function getSelectedContest(contestId){

    const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/contests" +
        "?id=eq." +
        encodeURIComponent(contestId) +
        "&select=id,name,organization_name,organization_id,vote_price",
        {
            headers:supabaseHeaders()
        }
    );

    if(!response.ok){
        throw new Error("Could not load contest.");
    }

    const contests = await response.json();

    if(!contests.length){
        throw new Error("Contest not found.");
    }

    return contests[0];

}


/* =========================
   LOAD CONTESTANTS
========================= */

async function loadContestants(contestId){

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/contestants" +
            "?contest_id=eq." +
            encodeURIComponent(contestId) +
            "&select=id,name,contest_id,photo" +
            "&order=created_at.asc",
            {
                headers:supabaseHeaders()
            }
        );

        if(!response.ok){

            console.error(await response.text());

            alert("Could not load contestants.");

            return [];
        }

        return await response.json();

    }catch(error){

        console.error(error);

        alert("Connection error.");

        return [];
    }

}


/* =========================
   SHOW CONTESTANTS
========================= */

async function showContestants(){

    const contestId = contestSelect.value;

    contestantsList.innerHTML = "";
    votingPanel.style.display = "none";
    contestInfo.style.display = "none";

    currentContest = null;
    currentContestant = null;

    if(!contestId){

        contestantsList.textContent =
            "Please select a contest.";

        return;
    }

    contestantsList.textContent =
        "Loading contest...";

    try{

        currentContest =
            await getSelectedContest(contestId);

        contestName.textContent =
            currentContest.name;

        organizationName.textContent =
            "Organisation: " +
            (currentContest.organization_name || "VBC Votes");

        const price =
            Number(currentContest.vote_price || 100);

        votePrice.textContent =
            "Price per vote: ₦" +
            price.toLocaleString();

        contestInfo.style.display = "block";

        contestantsList.textContent =
            "Loading contestants...";

        const contestants =
            await loadContestants(contestId);

        contestantsList.innerHTML = "";

        if(!contestants.length){

            contestantsList.textContent =
                "No contestants registered for this contest.";

            return;
        }

        contestants.forEach(function(contestant){

            const div =
                document.createElement("div");

            div.className = "contestant";

            if(contestant.photo){

                const img =
                    document.createElement("img");

                img.src = contestant.photo;
                img.alt = "Contestant Photo";

                div.appendChild(img);

            }

            const heading =
                document.createElement("h2");

            heading.textContent =
                contestant.name;

            div.appendChild(heading);

            const button =
                document.createElement("button");

            button.className = "voteButton";
            button.textContent = "Vote Now";

            button.addEventListener(
                "click",
                function(){
                    openVotingPanel(contestant);
                }
            );

            div.appendChild(button);

            contestantsList.appendChild(div);

        });

    }catch(error){

        console.error(error);

        contestantsList.textContent =
            "Unable to load this contest.";

    }

}


/* =========================
   OPEN VOTING PANEL
========================= */

function openVotingPanel(contestant){

    currentContestant = contestant;

    selectedContestant.innerHTML = "";

    if(contestant.photo){

        const img =
            document.createElement("img");

        img.src = contestant.photo;
        img.alt = "Contestant Photo";

        selectedContestant.appendChild(img);

    }

    const heading =
        document.createElement("h3");

    heading.textContent =
        "Voting for: " + contestant.name;

    selectedContestant.appendChild(heading);

    voterName.value = "";
    voterEmail.value = "";
    voterPhone.value = "";
    voteAmount.value = "";

    totalAmount.textContent = "Total: ₦0";

    votingPanel.style.display = "block";

    votingPanel.scrollIntoView({
        behavior:"smooth"
    });

}


/* =========================
   CALCULATE AMOUNT
========================= */

voteAmount.addEventListener(
    "change",
    function(){

        const votes = Number(voteAmount.value);

        const price = Number(
            currentContest?.vote_price || 100
        );

        const amount = votes * price;

        totalAmount.textContent =
            "Total: ₦" + amount.toLocaleString();

    }
);


/* =========================
   PAYSTACK PAYMENT
========================= */

payButton.addEventListener(
    "click",
    async function(){

        const name = voterName.value.trim();
        const email = voterEmail.value.trim();
        const phone = voterPhone.value.trim();
        const votes = Number(voteAmount.value);

        if(!currentContest){

            alert("Please select a contest.");

            return;
        }

        if(!currentContestant){

            alert("Please select a contestant.");

            return;
        }

        if(!name){

            alert("Please enter your name.");

            voterName.focus();

            return;
        }

        if(!email){

            alert("Please enter your email address.");

            voterEmail.focus();

            return;
        }

        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){

            alert("Please enter a valid email address.");

            voterEmail.focus();

            return;
        }

        if(!Number.isSafeInteger(votes) || votes < 1){

            alert("Please select the number of votes.");

            return;
        }

        payButton.disabled = true;

        payButton.textContent =
            "Connecting to Paystack...";

        try{

            const response = await fetch(
                FUNCTION_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json",
                        "apikey":SUPABASE_KEY
                    },
                    body:JSON.stringify({

                        contestId:
                            currentContest.id,

                        organizationId:
                            currentContest.organization_id,

                        contestantId:
                            currentContestant.id,

                        contestantName:
                            currentContestant.name,

                        votes:votes,

                        voterName:name,

                        voterEmail:email,

                        voterPhone:phone

                    })
                }
            );

            const result = await response.json();

            console.log(
                "Payment response:",
                result
            );

            const authorizationUrl =
                result.data?.authorization_url ||
                result.authorization_url;

            if(result.status && authorizationUrl){

                window.location.href =
                    authorizationUrl;

                return;
            }

            alert(
                "Unable to start payment.\n\n" +
                (result.error || JSON.stringify(result))
            );

        }catch(error){

            console.error(error);

            alert(
                "Payment connection failed.\n\n" +
                error.message
            );

        }finally{

            payButton.disabled = false;

            payButton.textContent =
                "Proceed to Payment";

        }

    }
);


/* =========================
   CANCEL
========================= */

cancelButton.addEventListener(
    "click",
    function(){

        votingPanel.style.display = "none";

        currentContestant = null;

    }
);

=======================

contestSelect.addEventListener(

========================= */

async function startPage(){

    await verifyPaymentReturn();

    await loadContests();

}

startPage();
